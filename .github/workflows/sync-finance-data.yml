name: Sincronizar dados financeiros

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar Google Sheets
        run: python scripts/sync_sheet.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-data.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Atualiza dados financeiros da planilha"
            git push
          fi
